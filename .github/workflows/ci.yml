name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.x", "24.x"]
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  pi-smoke:
    # Installs the packed package into a clean Pi profile, using the Pi version
    # in package-lock.json, and runs `pi -p` with a deliberately invalid key.
    # The unit suite resolves pi-ai from this checkout; this job loads the
    # extensions through Pi's own loader, as participants get them. Needs no
    # secret: the gateway's invalid_credential reply is the expected outcome.
    name: pi -p smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run test:smoke

  live:
    # Optional integration test against the real CAIL gateway. Runs only when
    # a repository secret is configured; never needed for ordinary CI.
    name: live CAIL integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cail-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run test:live
        env:
          CAIL_LIVE_TEST_KEY: ${{ secrets.CAIL_LIVE_TEST_KEY }}

  publish:
    # Publishes to npm when a v* tag is pushed, after the unit matrix and the
    # pi -p smoke test pass.
    # Authenticates through npm trusted publishing (OIDC): no npm token is
    # stored here. The trusted publisher on npmjs.com names this file, ci.yml.
    # Verbose logging is the only way npm reports whether the OIDC exchange
    # succeeded, so a misconfigured trusted publisher is diagnosable.
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, pi-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --loglevel verbose
